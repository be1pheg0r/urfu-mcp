# Пример всех параметров config.yaml; описания находятся в комментариях.
# При первом запуске `urfu-mcp init` создаёт config.yaml с безопасными значениями.
# Секреты и person_id в конфиг не записываются.

server:
  # Имя MCP-сервера, объявляемое клиенту.
  name: urfu-mcp

auth:
  issuer: null
  client_id: null
  redirect_uri: http://127.0.0.1:43123/callback
  person_id_claim: person_id
  token_kind: null
  callback_timeout_seconds: 300
  metadata_timeout_seconds: 10
  metadata_max_bytes: 1000000
  transaction_ttl_seconds: 600

modeus_http:
  # Ограничения прямых HTTPS-запросов только к официальному Modeus host.
  timeout_seconds: 10.0
  max_response_bytes: 2000000
  event_page_size: 1000
  person_page_size: 50
  person_max_pages: 10

schedule:
  timezone: Asia/Yekaterinburg
  max_days: 14
  max_subjects: 3

elearn:
  # Каталог сохранения файлов курса; null использует ~/.urfu-mcp/files.
  files_directory: null
