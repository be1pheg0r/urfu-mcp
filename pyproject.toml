[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urfu-mcp"
version = "0.1.0"
description = "Python schedule adapter for URFU Modeus services"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.8,<2",
    "httpx>=0.27,<1",      # Local SfeduSchedule HTTP adapter
    "keyring>=25.7,<26",
    "mcp>=2,<3",           # Official MCP server SDK
    "pydantic>=2.10,<3",   # Validation of normalized Modeus data
    "playwright>=1.52,<2", # Browser-based Modeus SSO session
    "PyYAML>=6,<7",        # Secure loading and generation of local server config
    "tzdata>=2025.2,<2027", # IANA timezone database, including Windows
    "psutil>=6,<9",
    "rich>=13.9,<15",       # First-run terminal wizard
    "questionary>=2.1,<3",
]

[project.scripts]
urfu-mcp = "urfu_mcp.auth.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["urfu_mcp*"]

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "pytest>=8,<10",      # Contract tests with synthetic responses
    "ruff>=0.13,<1",
    "mypy>=1.18,<2",
    "types-PyYAML>=6,<7",
    "types-psutil>=6,<9",
]

# SfeduSchedule is a Git submodule / .NET sidecar, not a Python dependency. Python's zoneinfo
# handles Asia/Yekaterinburg.
